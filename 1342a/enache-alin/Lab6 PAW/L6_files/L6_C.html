
<!DOCTYPE html>
<html>
<head>
    <title>Exercitiul 4</title>
</head>
<body>

    <h1 id="titlu" style="color: blue;">JavaScript si DOM</h1>

    <p id="paragraf" style="background-color: yellow;">
        Acesta este primul rand.<br>
        Acesta este al doilea rand.<br>
        Acesta este al treilea rand.
    </p>

    <script>
        document.getElementById("titlu").onclick = function() {
            var c = prompt("Introduceti culoarea textului titlului:");

            if (c !== null && CSS.supports("color", c)) {
                this.style.color = c;
            }
            else if (c !== null) {
                alert("Culoare incorecta!");
            }
        };

        document.getElementById("paragraf").onclick = function() {
            var c = prompt("Introduceti culoarea de fundal a paragrafului:");

            if (c !== null && CSS.supports("color", c)) {
                this.style.backgroundColor = c;
            }
            else if (c !== null) {
                alert("Culoare incorecta!");
            }
        };
    </script>

</body>
</html>
